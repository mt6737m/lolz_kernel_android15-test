name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev lz4 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev

    - name: Download Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
        tar -xf master.tar.gz --strip-components=1
        cd ..

     - name: Integrate KernelSU
  run: |
    cd $GITHUB_WORKSPACE
    # Replace 'drivers/kernelsu' with the correct path relative to your kernel root if needed
    git clone https://github.com/tiann/KernelSU.git drivers/kernelsu

    - name: Build Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        echo "============================================="
        echo "          STARTING YOUR KERNEL BUILD         "
        echo "============================================="
        make O=out vendor/msm8937_defconfig CC=clang HOSTCC=clang
        
        make -j$(nproc --all) O=out \
                      CC=clang \
                      HOSTCC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      KCFLAGS="-O2 -pipe"
        
    - name: Checking Kernel Output
      run: |
        echo "============================================="
        echo "          CHECKING KERNEL OUTPUT             "
        echo "============================================="
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "SUCCESS: Image found!"
          echo "KERNEL_PATH=out/arch/arm64/boot/Image" >> $GITHUB_ENV
        else
          echo "ERROR: No kernel Image found! Build genuinely failed."
          exit 1
        fi

    - name: Prepare Artifact
      run: |
        cp ${{ env.KERNEL_PATH }} ./Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image
        path: Image
