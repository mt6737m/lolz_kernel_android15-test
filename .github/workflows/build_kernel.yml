name: Build Android Kernel

on:
  workflow_dispatch: # Запуск вручную кнопкой

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzma lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

   - name: Download Clang Toolchain
      run: |
        # Убираем жесткую привязку к ветке '18', Git сам выберет актуальную дефолтную ветку
        git clone https://github.com/ZyCromerZ/Clang.git --depth=1 clang
        echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
        
    # === НОВЫЙ ШАГ (Добавлен тут) ===
    - name: Setup KernelSU
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

    # === ОБНОВЛЕННЫЙ ШАГ СБОРКИ ===
    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Переменная со всеми флагами, включая LLVM=1 для сборки без GCC
        MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-"
        
        # !!! ЗАМЕНИ 'имя_вашего_defconfig' НА СВОЙ (например, vendor/bluejay_defconfig) !!!
        make $MAKE_ARGS defconfig
        make $MAKE_ARGS -j$(nproc)

    - name: Generate Release Tag
      id: tag
      run: |
        echo "release_tag=kernel_$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "Android Kernel Build [${{ steps.tag.outputs.release_tag }}]"
        body: |
          ### Статус сборки: Успешно!
          - **Архитектура:** arm64
          - **Компилятор:** Google Clang + LLVM
          - **Особенности:** Встроенный KernelSU
        draft: false
        prerelease: false
        files: |
          out/arch/arm64/boot/Image*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
